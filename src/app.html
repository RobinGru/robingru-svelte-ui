<!doctype html>
<html lang="de" data-theme="robin">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eff8ff" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="describedby" href="%sveltekit.assets%/llms.txt" type="text/markdown" />
    <script>
      try {
        const root = document.documentElement;
        if (localStorage.getItem('rg-docs-density') === 'compact') root.dataset.density = 'compact';
        const theme = localStorage.getItem('rg-docs-theme');
        if (theme === 'dark') root.dataset.theme = 'robin-dark';
        if (theme === 'light') root.dataset.theme = 'robin';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
