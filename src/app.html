<!doctype html>
<html lang="de" data-theme="robin">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eff8ff" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="describedby" href="%sveltekit.assets%/llms.txt" type="text/markdown" />
    <script>
      try {
        const root = document.documentElement;
        const audit = new URLSearchParams(window.location.search);
        const auditDensity = audit.get('rg-audit-density');
        const auditTheme = audit.get('rg-audit-theme');
        if (auditDensity === 'compact' || (!auditDensity && localStorage.getItem('rg-docs-density') === 'compact')) root.dataset.density = 'compact';
        const theme = localStorage.getItem('rg-docs-theme');
        if (auditTheme === 'dark' || (!auditTheme && theme === 'dark')) root.dataset.theme = 'robin-dark';
        if (auditTheme === 'light' || (!auditTheme && theme === 'light')) root.dataset.theme = 'robin';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
